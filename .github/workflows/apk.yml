# Fork-only: builds a debug APK on demand and keeps it as an artifact.
# Not part of the upstream PR.
name: Debug APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: "go.mod"
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "21"
      # Gradle signs debug builds with ~/.android/debug.keystore, generating a
      # new one if missing; a fixed key lets each build install over the last.
      - run: mkdir -p ~/.android && echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_B64 }}
      # No fmt-check: upstream main currently fails ktfmt on a file this
      # branch doesn't touch (UseExitNodeWorker.kt).
      - run: make tailscale-debug.apk
      - run: make test
      - uses: actions/upload-artifact@v4
        with:
          name: tailscale-debug
          path: tailscale-debug.apk
